version: "3"

tasks:
  setup:
    desc: Create the zig toolchain used to compile C++ when no system compiler exists
    status:
      - test -d .tools/zig
    cmds:
      - uv venv .tools/zig
      - uv pip install --python .tools/zig ziglang

  fmt:
    cmds:
      - cargo fmt --all --check

  clippy:
    deps: [setup]
    cmds:
      - |
        if command -v c++ >/dev/null 2>&1; then
          cargo clippy --workspace --all-targets --locked -- -D warnings
        else
          zig_dir=$(echo "$PWD"/.tools/zig/lib/python3*/site-packages/ziglang)
          host=$(rustc -vV | sed -n 's/^host: //p')
          PATH="$zig_dir:$PATH" cargo-zigbuild clippy --workspace --all-targets --locked --target "$host" -- -D warnings
        fi

  test:
    deps: [setup]
    cmds:
      - |
        if command -v c++ >/dev/null 2>&1; then
          cargo test --workspace --locked
        else
          zig_dir=$(echo "$PWD"/.tools/zig/lib/python3*/site-packages/ziglang)
          host=$(rustc -vV | sed -n 's/^host: //p')
          PATH="$zig_dir:$PATH" cargo-zigbuild test --workspace --locked --target "$host"
        fi

  schema:
    desc: Regenerate schemas/ from the Rust model
    deps: [setup]
    cmds:
      - |
        if command -v c++ >/dev/null 2>&1; then
          cargo run -q -p tge --locked -- schema --out schemas
        else
          zig_dir=$(echo "$PWD"/.tools/zig/lib/python3*/site-packages/ziglang)
          host=$(rustc -vV | sed -n 's/^host: //p')
          PATH="$zig_dir:$PATH" cargo-zigbuild run -q -p tge --locked --target "$host" -- schema --out schemas
        fi

  check:
    desc: Format, lint and test (later tasks append steps)
    cmds:
      - task: fmt
      - task: clippy
      - task: test
