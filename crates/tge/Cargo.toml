[package]
name = "tge"
description = "CLI for building, labeling and searching Telegram premium emoji catalogs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image-webp = "0.2.4"
jsonschema = { version = "0.60.2", default-features = false }
png = "0.18"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "3"
vp9dec = "=0.1.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3.27.0"
tiny_http = "0.12"
